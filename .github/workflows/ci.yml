# Checks every pull request and every push to main.
# The same checks run locally with `make check` (see docs/tooling.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skills and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the version gate diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skills, marketplace, links and catalog
        run: python scripts/skillkit.py validate

      - name: Require a version bump and changelog entry for changed skills
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/skillkit.py check-versions --base "origin/${BASE_REF}"

      - name: Test skillkit
        run: python -m pytest -q

      - name: Lint and format-check Python
        run: |
          python -m ruff check scripts tests
          python -m ruff format --check scripts tests

      - name: Build skill packages
        run: python scripts/skillkit.py package

      - name: Upload skill packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.24.0

  plugin:
    name: Claude Code marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: claude plugin validate --strict
        run: npx --yes @anthropic-ai/claude-code@2.1.321 plugin validate . --strict
